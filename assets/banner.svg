<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.5; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -80; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-400px); }
      100% { transform: translateY(400px); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 300px; }
    .stream-line { stroke-dasharray: 8, 12; animation: dashMove 4s linear infinite; }
    .stream-line-reverse { stroke-dasharray: 6, 10; animation: dashMove 3s linear infinite reverse; }
    .card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <circle class="orb-1" cx="220" cy="120" r="140" fill="#6366f1" filter="url(#softGlow)" />
  <circle class="orb-2" cx="980" cy="280" r="160" fill="#ec4899" filter="url(#softGlow)" />
  <circle cx="600" cy="380" r="180" fill="#06b6d4" opacity="0.2" filter="url(#softGlow)" />

  <!-- Isometric Matrix Grid Background -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Network Connection Streams (Underlay) -->
  <g opacity="0.45">
    <path class="stream-line" d="M 50 320 Q 300 240 600 290 T 1150 200" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="stream-line-reverse" d="M 100 120 Q 450 180 800 110 T 1120 280" fill="none" stroke="#06b6d4" stroke-width="2" />
    <path class="stream-line" d="M 200 370 Q 550 310 900 360 T 1180 140" fill="none" stroke="#ec4899" stroke-width="1.8" />
  </g>

  <!-- Left Floating Dynamic Pill / Node (Background decoration) -->
  <g class="card-1" transform="translate(60, 65)">
    <rect width="160" height="44" rx="22" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="22" r="6" fill="#10b981" />
    <text x="40" y="27" fill="#94a3b8" class="mono-text" font-size="12" font-weight="600">SAFe 6.0 • PI Boards</text>
  </g>

  <!-- Right Floating Dynamic Pill (Background decoration) -->
  <g class="card-2" transform="translate(980, 80)">
    <rect width="165" height="44" rx="22" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="22" r="6" fill="#6366f1">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="27" fill="#cbd5e1" class="mono-text" font-size="12" font-weight="600">Portfolio OKRs</text>
  </g>

  <!-- Foreground Title and Branding (Stands out crisp & unaffected) -->
  <g transform="translate(600, 165)" text-anchor="middle">
    <!-- Category Mini-Badge -->
    <rect x="-140" y="-85" width="280" height="28" rx="14" fill="#312e81" stroke="#4f46e5" stroke-width="1.2" />
    <text x="0" y="-67" fill="#a5b4fc" class="title-text" font-size="11.5" letter-spacing="2">ENTERPRISE AGILE PLANNING</text>

    <!-- Main Title with Glowing Gradient Text -->
    <text x="0" y="0" fill="url(#primaryGlow)" class="title-text" font-size="46" letter-spacing="-0.5" filter="url(#glow)">Awesome Enterprise Agile Planning</text>

    <!-- Subtitle -->
    <text x="0" y="44" fill="#f8fafc" class="title-text" font-size="20" font-weight="600" opacity="0.95">Portfolio Governance • Scaled Frameworks • Open-Source &amp; Cloud Suites</text>

    <!-- Tagline description -->
    <text x="0" y="78" fill="#94a3b8" class="sub-text" font-size="14.5">
      The definitive curated benchmark of modern SaaS platforms, SAFe program boards, and self-hosted agile stacks
    </text>
  </g>

  <!-- Bottom Floating Metrics / Feature Badges -->
  <g transform="translate(600, 320)" text-anchor="middle">
    <!-- Badge 1: SAFe / LeSS / Spotify -->
    <g transform="translate(-320, 0)">
      <rect x="-90" y="-16" width="180" height="34" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="0" y="6" fill="#38bdf8" class="mono-text" font-size="12" font-weight="600">⚡ SAFe &amp; LeSS Ready</text>
    </g>

    <!-- Badge 2: Open Source & Self Hosted -->
    <g transform="translate(0, 0)">
      <rect x="-105" y="-16" width="210" height="34" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="0" y="6" fill="#a78bfa" class="mono-text" font-size="12" font-weight="600">🔓 Self-Hosted Alternatives</text>
    </g>

    <!-- Badge 3: Strategy to Execution -->
    <g transform="translate(320, 0)">
      <rect x="-95" y="-16" width="190" height="34" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="0" y="6" fill="#f472b6" class="mono-text" font-size="12" font-weight="600">📊 Strategy to Delivery</text>
    </g>
  </g>

  <!-- Bottom Decorative Border Accent -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#primaryGlow)" />
</svg>
